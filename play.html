<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <!-- ?v= はブラウザに古い css/js を使わせないためのもの。
         play.css / utils.js / debug.js / cqt.js / play.js を変更したら日付を更新する。
         一覧ページ (*/*.html) も utils.js / list.js を ?v= 付きで読んでいるので、
         utils.js / list.js を変更したらそちらも合わせて更新する。 -->
    <link rel="stylesheet" href="play.css?v=20261115.2">
  </head>
  <body>
    <div class="flex flex-center">
      <div class="flex" id="bigvideoContainer" style="display:none">
	<video id="bigvideo" playsinline width="1280" height="720" style="object-fit: fill;" class="fullwidth"> </video>
      </div>
    </div>
    <div class="flex flex-center">
      <div class="col">
        <video id="video" width="320" height="180" playsinline style="object-fit: cover;" class="fullwidth"> </video>
      </div>
      <div class="col flex-center">
        <div class="row" style="margin: 0.2em 0.6em 0.8em 0.4em;">
          <button id="resetButton" style="width:10em; height:2em;">
            Loading
          </button>
        </div>
        <div class="row" style="margin: 0.2em 0.6em 0.6em 0.4em;">
          <button id="playButton" style="width:10em; height:7.5em;">
            Loading
          </button>
	</div>
        <div class="row" style="margin: 0.2em 0.6em 0.8em 0.4em; text-align: center; line-height: 0.7em;">
	  <div>
	    volume: </br>
	    <input id="volumeRange" type="range" min=0 max=100 step=1 />
          </div>
	</div>
      </div>
      <div class="col" style="text-align: center; width: 9em; white-space: nowrap;">
        <div class="row" style="margin: 0.5em;">
          <span class="textContainer">
             rehearsal:
          </span>
        </div>
        <div class="row" style="margin: 0.5em;">
          <span class="textContainer"  >
            <text id="rehearsalNumber"> --- </text>
          </span>
        </div>
        <div class="row" style="margin: 0.2em;">
          <button id="prevButton" style="width:2em; height:3.5em; margin: 0.2em">
            &lt;&lt;
          </button>
          <button id="currButton" style="width:2em; height:3.5em; margin: 0.2em">
            &lt;
          </button>
          <button id="nextButton" style="width:2em; height:3.5em; margin: 0.2em">
            &gt;
          </button>
        </div>
        <div class="row" style="text-align: center; margin: 1em 0em;">
          <div id="rehearsalProgressBarContainer">
            <canvas id="rehearsalProgressBar" width="120" height="30" style="background-color: black;"> rehearsal progress bar </canvas>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="row" style="margin: 0.5em;">
          <div>
            <span class="textContainer">
              current:<text id="currentTime"> (currentTime) </text>
            </span>
            <span class="textContainer">
              duration:<text id="durationTime"> (durationTime) </text>
            </span>
            <span class="textContainer">
              hit:<text id="hitTime"> --:--.- </text>
            </span>
          </div>
        </div>
        <div class="row" style="margin: 0.5em;">
          <div>
            <video id="spectrum" width="448" height="136" playsinline>
          </div>
        </div>
        <div class="row" id="liveSpectrumContainer" style="margin: 0.5em; display: none;">
          <canvas id="liveSpectrum" width="448" height="136" style="background-color: black; max-width: 100%;"> </canvas>
          <div id="liveSpectrumInfo" style="font-size: 9px; max-width: 448px;"> </div>
        </div>
      </div>
    </div>
    <div class="flex flex-center">
      <div class="row" id="progressBarRow">
        <div id="progressBarContainer" style="background-color: lightgray;">
          <canvas id="progressBar" width="1080" height="120"> </canvas>
          <img src="" id="waveimage" style="display:none" />
        </div>
      </div>
    </div>
    <script src="utils.js?v=20261115.5"> </script>
    <script src="debug.js?v=20261115.2"> </script>
    <script src="cqt.js?v=20261115.4"> </script>
    <script src="play.js?v=20261115.6"> </script>
  </body>
</html>
